<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./logo-easycash.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <!-- 2026-09-05 redesign: Fraunces (serif display headings) alongside the existing Plus Jakarta
         Sans (body/UI), matching the approved landing-page mockup. Plus Jakarta Sans was already
         referenced in tailwind.config.ts but never actually loaded anywhere - this link fixes that
         too, so it stops silently falling back to the system sans-serif. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,680;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Lets mobile visitors "Add to Home Screen" with the real Easycash icon and brand color,
         instead of a generic browser-tab shortcut. Icons in site.webmanifest were generated by
         padding the existing logo-easycash.png to a square (it is natively a wide 500x200 wordmark),
         not a newly designed asset. -->
    <link rel="manifest" href="./site.webmanifest" />
    <title>Easycash Client Portal</title>
    <meta
      name="description"
      content="Easycash Lending Company, Inc. - apply online for a Business, Salary, or Seafarer Loan and track your application anytime. SEC Reg. No. CS201001882, Certificate of Authority No. 640."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / social sharing. Kept in sync with the <title>/<description> above; a shared
         Easycash link should never preview as an untitled page. `og:url` is intentionally omitted
         until the production domain is confirmed - a wrong canonical URL is worse than none.
         See docs/PORTAL_WEBSITE_STRATEGY.md §7 question 3. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Easycash Lending Company, Inc." />
    <meta property="og:title" content="Easycash | Business, Salary &amp; Seafarer Loans in the Philippines" />
    <meta
      property="og:description"
      content="Apply online for a Business, Salary, or Seafarer Loan and track your application anytime."
    />
    <meta property="og:image" content="./logo-easycash.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Structured data: lets search engines show Easycash's verified corporate identity, and ties
         the site to the SEC registration a borrower can check. Values MUST match
         src/lib/companyInfo.ts exactly - both are legal disclosures. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FinancialService",
        "name": "Easycash Lending Company, Inc.",
        "alternateName": "Easycash",
        "description": "SEC-registered lending company in the Philippines offering Business, Salary, and Seafarer Loans.",
        "telephone": "(02) 5 310-3708",
        "email": "loans@easycash.ph",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Unit 9 G/F The Midland Plaza, M. Adriatico Street, Barangay 669",
          "addressLocality": "Ermita, Manila",
          "addressCountry": "PH"
        },
        "areaServed": "PH",
        "identifier": [
          { "@type": "PropertyValue", "name": "SEC Registration No.", "value": "CS201001882" },
          { "@type": "PropertyValue", "name": "Certificate of Authority No.", "value": "640" }
        ]
      }
    </script>
  </head>
  <body>
    <script>
      (function () {
        var stored = localStorage.getItem('easycash-portal-theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

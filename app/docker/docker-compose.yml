name: easycash

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: easycash
      POSTGRES_PASSWORD: easycash
      POSTGRES_DB: easycash
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U easycash -d easycash']
      interval: 5s
      timeout: 5s
      retries: 10

  easycashbackend:
    build:
      context: ../easycashbackend
      dockerfile: ../docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ../easycashbackend/.env
    environment:
      DATABASE_URL: postgresql://easycash:easycash@postgres:5432/easycash?schema=public
      # ../easycashbackend/.env's LIBREOFFICE_BINARY_PATH is the Windows path for a host-run `npm run dev`
      # - this Linux container has its own apk-installed LibreOffice at a different path, same
      # reasoning as the DATABASE_URL override above.
      LIBREOFFICE_BINARY_PATH: /usr/bin/soffice
    ports:
      - '4000:4000'
    # 2026-07-25: Docker Desktop's internal DNS resolver (127.0.0.11) intermittently fails to
    # resolve external hostnames (e.g. api.m360.com.ph for the SMS gateway) - confirmed flaky via
    # repeated lookups (1 failure in 5 tries), most noticeable right after a host network change
    # (LAN IP switch). Explicit public resolvers bypass the internal proxy's flakiness.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # 2026-09-05: the public resolvers above have no entry for `host.docker.internal` (it's a
    # Docker Desktop-only name, not a real DNS record) - once they replaced the embedded resolver,
    # every call from this container to the host (e.g. OllamaVisionModelClient's default
    # OLLAMA_BASE_URL) started failing with ENOTFOUND. A static hosts-file entry resolves it without
    # touching DNS at all, so it survives the override above.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # 2026-07-22: bind mount (not a named volume) so `docker compose` and a host-run `npm run
      # dev` both read/write the exact same folder - avoids the two silently diverging, which
      # caused signed loan documents generated under one runtime to 404 under the other.
      - ../easycashbackend/storage:/app/storage

  lmsfrontend:
    build:
      context: ../lmsfrontend
      dockerfile: ../docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - '5173:80'
      # 2026-07-30: 443 publish + the tailscale-certs bind mounts are commented out along with the
      # matching nginx.conf server block - see that file's comment. Re-enable both together once
      # the cert is re-issued.
      # - '443:443'
    # volumes:
      # 2026-07-22 (Tailscale HTTPS) - cert/key issued via `tailscale cert` on the host, mounted
      # read-only into the container for nginx to terminate TLS with. Machine-specific and
      # gitignored (app/docker/tailscale-certs/) - re-issue with `tailscale cert <hostname>` on any
      # other machine this gets deployed to.
      # - ./tailscale-certs/cert.pem:/etc/nginx/tailscale/cert.pem:ro
      # - ./tailscale-certs/key.pem:/etc/nginx/tailscale/key.pem:ro
    depends_on:
      - easycashbackend

  # 2026-08-13 (user request) - the Easycash Portal (client-facing) was previously only ever run
  # via `npm run dev` on the host (ephemeral - dies whenever that shell/session ends) or deployed
  # separately to Cloudflare Pages. Containerized here too, mirroring lmsfrontend exactly, so it
  # survives host restarts (`restart: unless-stopped`) as part of making this machine an "official"
  # always-on local server rather than something that needs a person to keep a dev server alive.
  portalfrontend:
    build:
      context: ../portalfrontend
      dockerfile: ../docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - '5199:80'
    depends_on:
      - easycashbackend

volumes:
  postgres_data:

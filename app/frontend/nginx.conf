server {
    # 2026-07-22: plain HTTP, kept working (not redirected to HTTPS) for the LAN-IP access path
    # (http://<lan-ip>:5173) used when testing isn't going through Tailscale - the frontend's
    # VITE_API_BASE_URL points straight at the backend's own port in that mode, not through this
    # nginx's /api/ proxy, so this block only needs to serve the static SPA.
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/tailscale/cert.pem;
    ssl_certificate_key /etc/nginx/tailscale/key.pem;

    # 2026-07-22: proxy the API through this same HTTPS origin instead of the browser hitting the
    # backend container directly on its own port - single origin means no CORS_ORIGIN juggling and
    # every request (including file downloads) is HTTPS end to end.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: direct navigation or a page refresh on a client-side route (e.g.
    # /loans/:id) must still serve index.html so React Router can take over - without this,
    # nginx looks for a literal file at that path and 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
